[project]
name = "surge-payment"
version = "0.1.0"
description = "Mock payment gateway with runtime-configurable faults"
requires-python = ">=3.11"
dependencies = [
    "fastapi[opentelemetry]>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surge_payment"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
