[package]
name = "surge-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
default-run = "surge-gateway"

[[bin]]
name = "surge-gateway"
path = "src/main.rs"

# Load generator for the WebSocket fan-out (week-3 exit criterion).
[[bin]]
name = "wsbench"
path = "src/bin/wsbench.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rskafka = { version = "0.6", default-features = false }
governor = "0.10"
dashmap = "6"
futures = "0.3"
bytes = "1"
tokio-tungstenite = "0.26"
hdrhistogram = "7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
