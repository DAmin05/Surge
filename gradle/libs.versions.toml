# Single source of truth for every JVM dependency version.
[versions]
spring-boot = "4.1.1"
spring-grpc = "1.1.1"
protoc = "4.36.2"
protobuf-gradle-plugin = "0.10.0"
grpc = "1.84.0"
testcontainers = "2.0.5"
otel-instrumentation = "2.31.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-grpc-bom = { module = "org.springframework.grpc:spring-grpc-dependencies", version.ref = "spring-grpc" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
otel-instrumentation-bom = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom", version.ref = "otel-instrumentation" }

spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protoc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }

junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle-plugin" }
