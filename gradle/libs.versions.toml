# Single source of truth for every JVM dependency version.
# Versions not listed here come from the Spring Boot BOM. protoc and grpc match the
# BOM's protobuf-java and grpc-java, because generated code must not be newer than the
# runtime it links against.
[versions]
spring-boot = "4.1.1"
protoc = "4.35.1"
protobuf-gradle-plugin = "0.10.0"
grpc = "1.83.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }

spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

postgresql = { module = "org.postgresql:postgresql" }
lettuce = { module = "io.lettuce:lettuce-core" }
kafka-clients = { module = "org.apache.kafka:kafka-clients" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protoc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }

flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers = { module = "org.testcontainers:testcontainers" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle-plugin" }
