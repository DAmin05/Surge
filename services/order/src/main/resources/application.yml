spring:
  application:
    name: order
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/surge}
    username: ${DB_USER:orders_app}
    password: ${DB_PASSWORD:orders_app_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000

server:
  port: ${PORT:8083}
  shutdown: graceful

surge:
  order:
    max-seats-per-user: 4
    inventory-grpc: ${INVENTORY_GRPC:localhost:9091}
    inventory-deadline: PT2S
    payment-url: ${PAYMENT_URL:http://localhost:8000}
    payment-timeout: ${PAYMENT_TIMEOUT:PT2M}
    timeout-sweep-interval: ${TIMEOUT_SWEEP_INTERVAL:PT5S}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
    kafka-bootstrap: ${KAFKA_BOOTSTRAP:localhost:19092}
    outbox-poll-interval: ${OUTBOX_POLL_INTERVAL:PT0.2S}
    idempotency-stale-after: PT60S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: order
    # Latency histograms for the war room's checkout p50/p99 (histogram_quantile).
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
