spring:
  application:
    name: admission
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8081}
  shutdown: graceful

surge:
  admission:
    admit-rate-per-sec: ${ADMIT_RATE_PER_SEC:200}
    admit-interval: ${ADMIT_INTERVAL:PT0.1S}
    token-lifetime: PT10M
    session-lifetime: PT24H
    keys-dir: ${JWT_KEYS_DIR:./secrets/jwt}
    cookie-secure: ${COOKIE_SECURE:false}
    redis-nodes: ${REDIS_NODES:localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: admission
