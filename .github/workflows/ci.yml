name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      # Unit + Testcontainers integration tests (Docker is available on the runner).
      - run: ./gradlew build --console=plain

  rust:
    name: Rust (gateway)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: gateway }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [payment, reconciler, chaos]
    defaults: { run: { working-directory: "${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, python-version: "3.12" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Week-0 exit criterion: `docker compose up` brings everything healthy.
  stack:
    name: "Exit: stack healthy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose and bake files
        run: |
          docker compose config -q
          docker buildx bake -f docker-bake.hcl --print > /dev/null
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait until every service is healthy
        run: TIMEOUT=300 scripts/check-stack.sh
      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
