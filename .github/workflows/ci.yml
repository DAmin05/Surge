name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # Unit + Testcontainers integration tests (Docker is available on the runner).
      - run: ./gradlew build --console=plain

  # Week-1 exit criterion: 1,000 virtual threads race for one seat -> exactly one
  # winner, at both layers (Redis hold, Postgres claim). Also run by the Java job;
  # kept separate so it can be a required check by name.
  race:
    name: "Exit: one seat, one winner"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: >-
          ./gradlew --console=plain
          :services:order:test --tests 'dev.surge.order.claim.ClaimRaceTest'
          :services:inventory:test --tests 'dev.surge.inventory.hold.HoldServiceTest'

  # Week-2 exit criterion: retrying the same checkout 100x yields one order, and with
  # Payment injecting declines, stalls, duplicate and out-of-order callbacks, every
  # order ends terminal with zero invariant violations.
  saga:
    name: "Exit: saga survives retries and faults"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAYMENT_TIMEOUT: PT10S
      PIN_GRACE: PT10S
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Idempotent checkout and saga outcomes (Testcontainers)
        run: >-
          ./gradlew --console=plain :services:order:test
          --tests 'dev.surge.order.checkout.IdempotentCheckoutTest'
          --tests 'dev.surge.order.saga.*'
      - uses: docker/setup-buildx-action@v4
      - name: Start stack with a 10 s payment timeout
        run: |
          docker compose build
          docker compose up -d
          TIMEOUT=300 scripts/check-stack.sh
      - name: Saga storm under injected payment faults
        run: BUYERS=150 scripts/saga-storm.sh
      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 order payment inventory reconciler
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Week-3 exit criterion: 10k simulated WebSocket clients receive seat updates in
  # under 200 ms p99, measured locally (`make ws-bench`, docs/results). A 4-vCPU runner
  # shares its cores between the stack and a 10k-client generator, so CI guards
  # against regressions at 5k clients with the same budget and zero missed updates.
  # Only the fan-out path runs (gateway, inventory, order and their infrastructure),
  # so the reconciler, payment, chaos and observability don't compete for the cores.
  fanout:
    name: "Exit: WebSocket fan-out p99 < 200 ms"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WS_CONNECT_PER_IP_PER_SEC: "100000"
      FANOUT_SERVICES: gateway inventory order
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Start the fan-out path
        run: |
          docker compose build gateway inventory order
          docker compose up -d $FANOUT_SERVICES
          SERVICES="$FANOUT_SERVICES" TIMEOUT=300 scripts/check-stack.sh
      - name: 5,000 WebSocket clients, 100 seat updates, every one delivered
        run: BENCH_CLIENTS=5000 scripts/ws-bench.sh
      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 gateway inventory
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Week-4 exit criterion: a buyer completes a purchase in the browser while a second
  # browser sees the seat go held, then sold, live; and one trace spans gateway,
  # order, inventory and payment.
  browser:
    name: "Exit: browser purchase, one trace"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: docker/setup-buildx-action@v4
      - name: Start stack
        working-directory: .
        run: |
          docker compose build
          docker compose up -d
          TIMEOUT=300 scripts/check-stack.sh
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Buyer checks out; a watcher sees the seat go held then sold
        run: npx playwright test
      - name: One trace spans gateway, order, inventory and payment
        working-directory: .
        run: scripts/trace-check.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
      - name: Dump state on failure
        if: failure()
        working-directory: .
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 gateway frontend order inventory payment
      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v --remove-orphans

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (gateway)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: gateway }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [payment, reconciler, chaos]
    defaults: { run: { working-directory: "${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, python-version: "3.12" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # `docker compose up` brings everything healthy, and the services work together.
  stack:
    name: "Exit: stack healthy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate compose and bake files
        run: |
          docker compose config -q
          docker buildx bake -f docker-bake.hcl --print > /dev/null
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait until every service is healthy
        run: TIMEOUT=300 scripts/check-stack.sh
      # Hold race on the real Redis Cluster, checkout over gRPC + Postgres, seat events.
      - name: End-to-end smoke test
        run: scripts/smoke.sh
      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
