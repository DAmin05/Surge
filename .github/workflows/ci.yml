name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      # Unit + Testcontainers integration tests (Docker is available on the runner).
      - run: ./gradlew build --console=plain

  # Week-1 exit criterion: 1,000 virtual threads race for one seat -> exactly one
  # winner, at both layers (Redis hold, Postgres claim). Also run by the Java job;
  # kept separate so it can be a required check by name.
  race:
    name: "Exit: one seat, one winner"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          ./gradlew --console=plain
          :services:order:test --tests 'dev.surge.order.claim.ClaimRaceTest'
          :services:inventory:test --tests 'dev.surge.inventory.hold.HoldServiceTest'

  # Week-2 exit criterion: retrying the same checkout 100x yields one order, and with
  # Payment injecting declines, stalls, duplicate and out-of-order callbacks, every
  # order ends terminal with zero invariant violations.
  saga:
    name: "Exit: saga survives retries and faults"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAYMENT_TIMEOUT: PT10S
      PIN_GRACE: PT10S
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Idempotent checkout and saga outcomes (Testcontainers)
        run: >-
          ./gradlew --console=plain :services:order:test
          --tests 'dev.surge.order.checkout.IdempotentCheckoutTest'
          --tests 'dev.surge.order.saga.*'
      - uses: docker/setup-buildx-action@v3
      - name: Start stack with a 10 s payment timeout
        run: |
          docker compose build
          docker compose up -d
          TIMEOUT=300 scripts/check-stack.sh
      - name: Saga storm under injected payment faults
        run: BUYERS=150 scripts/saga-storm.sh
      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 order payment inventory reconciler
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  rust:
    name: Rust (gateway)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: gateway }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [payment, reconciler, chaos]
    defaults: { run: { working-directory: "${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, python-version: "3.12" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # `docker compose up` brings everything healthy, and the services work together.
  stack:
    name: "Exit: stack healthy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose and bake files
        run: |
          docker compose config -q
          docker buildx bake -f docker-bake.hcl --print > /dev/null
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait until every service is healthy
        run: TIMEOUT=300 scripts/check-stack.sh
      # Hold race on the real Redis Cluster, checkout over gRPC + Postgres, seat events.
      - name: End-to-end smoke test
        run: scripts/smoke.sh
      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
