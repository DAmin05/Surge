global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]

  - job_name: java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["admission:8081", "inventory:8082", "order:8083"]

  - job_name: python
    static_configs:
      - targets: ["payment:8000", "reconciler:8001", "chaos:8002"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
