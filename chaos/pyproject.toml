[project]
name = "surge-chaos"
version = "0.1.0"
description = "Chaos controller: Docker SDK + Toxiproxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi[opentelemetry]>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "docker>=7.1",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surge_chaos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
